[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonecodex"
version = "0.1.0"
description = "Expose tmux and Codex sessions to a phone through ttyd, Tailscale, and a mobile paste/key toolbar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "phonecodex contributors" }]
keywords = ["codex", "tmux", "ttyd", "tailscale", "mobile", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
phonecodex = "phonecodex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phonecodex = ["assets/*.html"]

